<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký tài khoản mới | ShopEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-root="../">
  <div class="auth-wrapper">
    <!-- Header chuẩn Figma ShopEase -->
    <header class="auth-header">
      <div class="auth-header-inner">
        <a href="../index.html" class="auth-brand" title="Quay về trang chủ">
          <div class="auth-brand-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </div>
          <div class="auth-brand-text">
            <span class="auth-brand-name">ShopEase</span>
            <span class="auth-brand-slogan">Mua sắm thông minh &amp; dễ dàng</span>
          </div>
        </a>

        <div class="auth-hotline">
          <div class="auth-hotline-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <div class="auth-hotline-info">
            <span class="auth-hotline-label">Tổng đài CSKH</span>
            <span class="auth-hotline-number">1900 6868</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content: Card Đăng ký -->
    <main class="auth-main">
      <div class="auth-card auth-card-register">
        <div class="auth-card-header">
          <h1 class="auth-card-title">Đăng ký tài khoản</h1>
          <p class="auth-card-desc">Tạo tài khoản chỉ trong vài bước để bắt đầu trải nghiệm mua sắm.</p>
        </div>

        <div id="auth-alert" class="auth-alert" role="alert"></div>

        <form id="register-form" class="auth-form" novalidate>
          <!-- Họ và tên -->
          <div class="auth-field">
            <label for="reg-fullname" class="auth-label">
              Họ và tên <span class="auth-required">*</span>
            </label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input 
                type="text" 
                id="reg-fullname" 
                name="full_name" 
                class="auth-input" 
                placeholder="VD: Nguyễn Văn An" 
                autocomplete="name" 
                required
              >
            </div>
            <div id="reg-fullname-error" class="auth-field-error"></div>
          </div>

          <!-- 2 Cột: Số điện thoại & Email -->
          <div class="auth-row-2col">
            <!-- Số điện thoại -->
            <div class="auth-field">
              <label for="reg-phone" class="auth-label">
                Số điện thoại <span class="auth-required">*</span>
              </label>
              <div class="auth-input-wrapper">
                <span class="auth-input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
                    <path d="M12 18h.01"/>
                  </svg>
                </span>
                <input 
                  type="tel" 
                  id="reg-phone" 
                  name="phone" 
                  class="auth-input" 
                  placeholder="09xxxxxxxx" 
                  autocomplete="tel" 
                  required
                >
              </div>
              <div id="reg-phone-error" class="auth-field-error"></div>
            </div>

            <!-- Email -->
            <div class="auth-field">
              <label for="reg-email" class="auth-label">
                Địa chỉ Email <span class="auth-required">*</span>
              </label>
              <div class="auth-input-wrapper">
                <span class="auth-input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input 
                  type="email" 
                  id="reg-email" 
                  name="email" 
                  class="auth-input" 
                  placeholder="an.nguyen@email.com" 
                  autocomplete="email" 
                  required
                >
              </div>
              <div id="reg-email-error" class="auth-field-error"></div>
            </div>
          </div>

          <!-- 2 Cột: Mật khẩu & Xác nhận mật khẩu -->
          <div class="auth-row-2col">
            <!-- Mật khẩu -->
            <div class="auth-field">
              <label for="reg-password" class="auth-label">
                Mật khẩu <span class="auth-required">*</span>
              </label>
              <div class="auth-input-wrapper">
                <span class="auth-input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input 
                  type="password" 
                  id="reg-password" 
                  name="password" 
                  class="auth-input auth-input-has-action" 
                  placeholder="••••••••" 
                  autocomplete="new-password" 
                  required
                >
                <button type="button" class="auth-toggle-pwd" id="toggle-reg-password" title="Hiện hoặc ẩn mật khẩu">
                  <svg id="reg-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <div id="reg-password-error" class="auth-field-error"></div>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div class="auth-field">
              <label for="reg-confirm-password" class="auth-label">
                Xác nhận mật khẩu <span class="auth-required">*</span>
              </label>
              <div class="auth-input-wrapper">
                <span class="auth-input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <path d="m9 12 2 2 4-4"/>
                  </svg>
                </span>
                <input 
                  type="password" 
                  id="reg-confirm-password" 
                  name="confirm_password" 
                  class="auth-input auth-input-has-action" 
                  placeholder="••••••••" 
                  autocomplete="new-password" 
                  required
                >
                <button type="button" class="auth-toggle-pwd" id="toggle-reg-confirm-password" title="Hiện hoặc ẩn mật khẩu">
                  <svg id="reg-confirm-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <div id="reg-confirm-password-error" class="auth-field-error"></div>
            </div>
          </div>

          <!-- Điều khoản & Chính sách -->
          <div class="auth-field">
            <label class="auth-checkbox-row auth-checkbox-row-top">
              <input type="checkbox" id="reg-terms" class="auth-checkbox" style="margin-top: 3px;">
              <span class="auth-checkbox-text">
                Tôi đồng ý với <a href="javascript:void(0)">Điều khoản dịch vụ</a> và <a href="javascript:void(0)">Chính sách bảo mật</a> của ShopEase.
              </span>
            </label>
            <div id="reg-terms-error" class="auth-field-error"></div>
          </div>

          <!-- Nút Đăng ký -->
          <button type="submit" class="auth-submit-btn" id="btn-register-submit">
            <span class="auth-spinner"></span>
            <svg class="auth-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="8.5" cy="7" r="4"/>
              <line x1="20" y1="8" x2="20" y2="14"/>
              <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            <span class="auth-btn-text">Tạo tài khoản ngay</span>
          </button>
        </form>

        <div class="auth-switch-text">
          Bạn đã có tài khoản?
          <a href="login.html" class="auth-switch-link">
            Đăng nhập ngay
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    </main>

    <!-- Footer chuẩn Figma ShopEase -->
    <footer class="auth-footer">
      <div class="auth-footer-inner">
        <div class="auth-footer-left">
          <span>&copy; 2026 ShopEase Việt Nam. All rights reserved.</span>
        </div>
        <div class="auth-footer-links">
          <a href="javascript:void(0)" class="auth-footer-link">Điều khoản dịch vụ</a>
          <a href="javascript:void(0)" class="auth-footer-link">Chính sách bảo mật</a>
          <a href="javascript:void(0)" class="auth-footer-link">Trung tâm trợ giúp</a>
          <a href="javascript:void(0)" class="auth-footer-link">Liên hệ</a>
        </div>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/pages/register.js"></script>
</body>
</html>
