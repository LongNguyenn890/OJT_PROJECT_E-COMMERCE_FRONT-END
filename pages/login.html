<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập tài khoản | ShopEase</title>
  <link rel="icon" href="../assets/images/logo_shop.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body data-root="../">
  <div class="auth-wrapper">
    <!-- Header chuẩn Figma ShopEase -->
    <header class="auth-header">
      <div class="auth-header-inner">
        <a href="customer-home.html" class="auth-brand" title="Quay về trang chủ">
          <div class="auth-brand-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <path d="M3 6h18"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </div>
          <div class="auth-brand-text">
            <span class="auth-brand-name">ShopEase</span>
            <span class="auth-brand-slogan">Mua sắm thông minh &amp; dễ dàng</span>
          </div>
        </a>

        <div class="auth-hotline">
          <div class="auth-hotline-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </div>
          <div class="auth-hotline-info">
            <span class="auth-hotline-label">Tổng đài CSKH</span>
            <span class="auth-hotline-number">1900 6868</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content: Card Đăng nhập -->
    <main class="auth-main">
      <div class="auth-card auth-card-login">
        <div class="auth-card-header">
          <div class="auth-card-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 class="auth-card-title">Đăng nhập</h1>
          <p class="auth-card-desc">Chào mừng bạn quay lại với ShopEase</p>
        </div>

        <div id="auth-alert" class="auth-alert" role="alert"></div>

        <form id="login-form" class="auth-form" novalidate>
          <!-- Email / Số điện thoại -->
          <div class="auth-field">
            <label for="login-email" class="auth-label">Email hoặc Số điện thoại</label>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <input 
                type="text" 
                id="login-email" 
                name="email" 
                class="auth-input" 
                placeholder="name@example.com hoặc số điện thoại" 
                autocomplete="username" 
                required
              >
            </div>
            <div id="login-email-error" class="auth-field-error"></div>
          </div>

          <!-- Mật khẩu -->
          <div class="auth-field">
            <div class="auth-label-row">
              <label for="login-password" class="auth-label">Mật khẩu</label>
              <a href="javascript:void(0)" class="auth-forgot-link" id="btn-forgot-password">Quên mật khẩu?</a>
            </div>
            <div class="auth-input-wrapper">
              <span class="auth-input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="login-password" 
                name="password" 
                class="auth-input auth-input-has-action" 
                placeholder="Nhập mật khẩu" 
                autocomplete="current-password" 
                required
              >
              <button type="button" class="auth-toggle-pwd" id="toggle-password" title="Hiện hoặc ẩn mật khẩu">
                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div id="login-password-error" class="auth-field-error"></div>
          </div>

          <!-- Ghi nhớ đăng nhập -->
          <label class="auth-checkbox-row">
            <input type="checkbox" id="remember-me" class="auth-checkbox">
            <span class="auth-checkbox-text">Ghi nhớ đăng nhập</span>
          </label>

          <!-- Nút Đăng nhập -->
          <button type="submit" class="auth-submit-btn" id="btn-login-submit">
            <span class="auth-spinner"></span>
            <span class="auth-btn-text">Đăng nhập</span>
            <svg class="auth-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="m12 5 7 7-7 7"/>
            </svg>
          </button>
        </form>

        <div class="auth-switch-text">
          Chưa có tài khoản?
          <a href="register.html" class="auth-switch-link">Đăng ký ngay</a>
        </div>
      </div>
    </main>

    <!-- Footer chuẩn Figma ShopEase -->
    <footer class="auth-footer">
      <div class="auth-footer-inner">
        <div class="auth-footer-left">
          <span>&copy; 2026 ShopEase Việt Nam. Bảo lưu mọi quyền.</span>
        </div>
        <div class="auth-footer-links">
          <a href="javascript:void(0)" class="auth-footer-link">Điều khoản sử dụng</a>
          <a href="javascript:void(0)" class="auth-footer-link">Chính sách riêng tư</a>
          <a href="javascript:void(0)" class="auth-footer-link">Trung tâm trợ giúp</a>
        </div>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
